services:
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_CHAT_PROVIDER: ${RAG_CHAT_PROVIDER:-openai}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-gpt-5.6-luna}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-100}
      RAG_MAX_ANSWER_TOKENS: ${RAG_MAX_ANSWER_TOKENS:-1000}
      RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-10485760}
      RAG_MAX_DOCUMENT_TOKENS: ${RAG_MAX_DOCUMENT_TOKENS:-100000}
      RAG_CHUNK_MIN_TOKENS: ${RAG_CHUNK_MIN_TOKENS:-40}
      RAG_CHUNK_MAX_TOKENS: ${RAG_CHUNK_MAX_TOKENS:-800}
      RAG_CHUNK_OVERLAP_TOKENS: ${RAG_CHUNK_OVERLAP_TOKENS:-100}
      RAG_RETRIEVAL_TOP_K: ${RAG_RETRIEVAL_TOP_K:-5}
      RAG_RETRIEVAL_CANDIDATE_K: ${RAG_RETRIEVAL_CANDIDATE_K:-20}
      RAG_RETRIEVAL_MINIMUM_SCORE: ${RAG_RETRIEVAL_MINIMUM_SCORE:-0.50}
      RAG_RETRIEVAL_VECTOR_WEIGHT: ${RAG_RETRIEVAL_VECTOR_WEIGHT:-0.7}
      RAG_RETRIEVAL_TEXT_WEIGHT: ${RAG_RETRIEVAL_TEXT_WEIGHT:-0.3}
      RAG_CONTEXT_MAX_TOKENS: ${RAG_CONTEXT_MAX_TOKENS:-4000}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:5.5.0-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rag-postgres-data:
